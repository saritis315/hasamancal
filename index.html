<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הסמנכל · כניסה</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3Cmask id='c' maskUnits='userSpaceOnUse' x='0' y='0' width='40' height='40'%3E%3Crect width='40' height='40' fill='%23fff'/%3E%3Ccircle cx='29.2' cy='10.8' r='6.3' fill='%23000'/%3E%3C/mask%3E%3C/defs%3E%3Ccircle cx='20' cy='20' r='13.04' fill='none' stroke='%2314253D' stroke-width='7.93' mask='url(%23c)'/%3E%3Ccircle cx='29.2' cy='10.8' r='4.1' fill='%23E8912D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@900&text=הסמנכל&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login" id="main">
    <div class="card login__card stack-lg" id="login-card"></div>
  </main>
  <script type="module">
    import { el, icon, mount, field, logo } from './js/ui.js';
    import { signIn, getSession } from './js/supabase.js';
    import { callApi } from './js/api.js';

    // אחרי כניסה: אם אין הגדרת עסק, הקמה. אחרת, תמונת מצב (DESIGN 4.1).
    async function goAfterLogin() {
      const cfg = await callApi('config_get');
      location.replace(cfg.ok && cfg.config ? 'snapshot.html' : 'setup.html');
    }
    if (getSession()) { goAfterLogin(); }

    const email = el('input', { class: 'input', type: 'email', id: 'f-email', autocomplete: 'username', dir: 'ltr', style: 'text-align:start' });
    const pass = el('input', { class: 'input', type: 'password', id: 'f-pass', autocomplete: 'current-password', dir: 'ltr', style: 'text-align:start' });
    const fEmail = field({ id: 'f-email', label: 'אימייל', control: email });
    const fPass = field({ id: 'f-pass', label: 'סיסמה', control: pass });
    const errBox = el('div', { 'aria-live': 'assertive' });
    const submitBtn = el('button', { type: 'submit', class: 'btn btn--primary btn--lg', style: 'width:100%', text: 'כניסה' });

    const form = el('form', { class: 'stack', novalidate: true }, fEmail.root, fPass.root, errBox, submitBtn);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mount(errBox);
      fEmail.setError(email.value.trim() ? '' : 'יש להזין אימייל');
      fPass.setError(pass.value ? '' : 'יש להזין סיסמה');
      if (!email.value.trim() || !pass.value) { (!email.value.trim() ? email : pass).focus(); return; }
      submitBtn.disabled = true; submitBtn.textContent = 'נכנס';
      const res = await signIn(email.value, pass.value);
      if (!res.ok) {
        submitBtn.disabled = false; submitBtn.textContent = 'כניסה';
        // הודעה כללית, בלי פירוט
        mount(errBox, el('div', { class: 'notice notice--error', role: 'alert' },
          el('span', { class: 'notice__icon' }, icon('circle-x')), el('div', {}, el('strong', { text: 'פרטי הכניסה שגויים' }))));
        return;
      }
      await goAfterLogin();
    });

    mount(document.getElementById('login-card'),
      el('div', { class: 't-display' }, logo()),
      el('p', { class: 't-body-lg secondary', text: 'לדעת מה קורה. להחליט מה לעשות.' }),
      form);
    email.focus();
  </script>
</body>
</html>
