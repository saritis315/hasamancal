<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הסמנכל – עולם 3D</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#e8ecf6}
  canvas{display:block}
  #title{position:fixed;top:16px;right:20px;pointer-events:none}
  #title h1{margin:0;font-size:22px}
  #title p{margin:4px 0 0;font-size:13px;opacity:.7}
  #panel{position:fixed;top:16px;left:16px;width:300px;max-width:calc(100vw - 32px);background:rgba(15,22,45,.88);border:1px solid #2c3a6b;border-radius:12px;padding:14px 16px;backdrop-filter:blur(6px);display:none}
  #panel h2{margin:0 0 4px;font-size:18px}
  #panel .tag{font-size:12px;color:#8fb4ff;direction:ltr;text-align:right;margin-bottom:8px}
  #panel p{margin:0;font-size:14px;line-height:1.55}
  #legend{position:fixed;bottom:14px;right:16px;font-size:12px;opacity:.8;line-height:1.7;pointer-events:none}
  #legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
  #hint{position:fixed;bottom:14px;left:16px;font-size:12px;opacity:.6;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="title"><h1>הסמנכל – העולם בתלת־ממד</h1><p>גובה בניין = גודל המסמך. לחצי על בניין לפרטים.</p></div>
<div id="panel"><h2></h2><div class="tag"></div><p></p></div>
<div id="legend">
  <div><i style="background:#f5c542"></i>מקור האמת</div>
  <div><i style="background:#4f8cff"></i>מסמכים נגזרים</div>
  <div><i style="background:#3ddc97"></i>האפליקציה (פרונט, קיים)</div>
  <div><i style="background:#9aa3b8"></i>צד שרת (עוד לא נבנה)</div>
  <div><i style="background:#ff7ab8"></i>תמונות עיצוב</div>
</div>
<div id="hint">גרירה: סיבוב · גלגלת: זום · קליק ימני: הזזה</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.FogExp2(0x0b1020, 0.0075);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 38, 62);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.49;
controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
controls.target.set(0,4,0);

scene.add(new THREE.HemisphereLight(0xaac4ff, 0x1a2040, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(30,60,20); scene.add(sun);

// ground
const ground = new THREE.Mesh(new THREE.CircleGeometry(95,64),
  new THREE.MeshStandardMaterial({color:0x121a36, roughness:1}));
ground.rotation.x = -Math.PI/2; scene.add(ground);
const grid = new THREE.GridHelper(190, 76, 0x2a3a74, 0x1a2550);
grid.position.y = 0.02; scene.add(grid);

// stars
{
  const p = []; for(let i=0;i<700;i++){const r=150+Math.random()*100, a=Math.random()*6.28, h=Math.random()*120+10;
    p.push(Math.cos(a)*r, h, Math.sin(a)*r);}
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xffffff,size:0.8,fog:false})));
}

function label(text, {size=34, color='#fff', bg=null, w=512}={}){
  const c = document.createElement('canvas'); c.width = w; c.height = 96;
  const x = c.getContext('2d');
  if(bg){x.fillStyle=bg; x.beginPath(); x.roundRect(4,8,w-8,80,18); x.fill();}
  x.fillStyle = color; x.font = `700 ${size}px "Segoe UI",Arial`;
  x.textAlign='center'; x.textBaseline='middle'; x.direction='rtl';
  x.fillText(text, w/2, 50);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, depthTest:false}));
  s.scale.set(w/40, 96/40, 1); s.renderOrder = 10; return s;
}

const clickable = [];
const COL = {truth:0xf5c542, doc:0x4f8cff, app:0x3ddc97, ghost:0x9aa3b8, img:0xff7ab8};

function building({x,z,w=5,d=5,h,color,name,file,info,ghost=false,emissive=0.15}){
  const g = new THREE.Group(); g.position.set(x,0,z);
  const mat = ghost
    ? new THREE.MeshStandardMaterial({color, transparent:true, opacity:0.22, wireframe:false})
    : new THREE.MeshStandardMaterial({color, roughness:.45, metalness:.2, emissive:color, emissiveIntensity:emissive});
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.y = h/2; g.add(m);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
    new THREE.LineBasicMaterial({color: ghost?0xcfd6e8:0xffffff, transparent:true, opacity: ghost?.7:.35}));
  edges.position.y = h/2; g.add(edges);
  const l = label(name,{size:36,bg:'rgba(10,16,36,.75)'}); l.position.set(0,h+2.2,0); g.add(l);
  m.userData = {group:g, name, file, info, mat, base:emissive, ghost};
  g.userData.top = h; scene.add(g); clickable.push(m); return g;
}

// ---------- מקור האמת (מרכז) ----------
const center = building({x:0,z:0,w:7,d:7,h:20,color:COL.truth,emissive:.35,
  name:'עשרת ההיבטים + MVP', file:'product-10-definitions.md · MVP.md',
  info:'מקור האמת של הפרויקט. כל מסמך אחר נגזר מהם. אם משהו סותר אותם — עוצרים ושואלים.'});
// crown ring
const ring = new THREE.Mesh(new THREE.TorusGeometry(5.2,.18,12,64), new THREE.MeshBasicMaterial({color:COL.truth}));
ring.rotation.x = Math.PI/2; ring.position.y = 22; scene.add(ring);

// ---------- מסמכים נגזרים (טבעת) ----------
const docs = [
  {name:'PRD', file:'PRD.md', kb:34, info:'מסמך הדרישות למוצר: מי המשתמש, מה בונים ולמה. גרסה 2.1.'},
  {name:'ARCHITECTURE', file:'ARCHITECTURE.md', kb:77, info:'הארכיטקטורה: React + TypeScript + Vite בצד לקוח, פונקציה אחת ב-Vercel, Supabase עם טבלאות נעולות. גרסה 2.3. המסמך הגדול ביותר.'},
  {name:'tech-stack', file:'tech-stack.md', kb:28.5, info:'בחירות הטכנולוגיה, בכפוף ל-course-stack. מסומנים בו שינויי המסלול המשודרג.'},
  {name:'DESIGN', file:'DESIGN.md', kb:37, info:'מערכת העיצוב: צבעים, טיפוגרפיה ורכיבים. המוצר בעברית ו-RTL.'},
  {name:'MILESTONES', file:'MILESTONES.md', kb:23, info:'אבני דרך ולוח זמנים. גרסה 1.3, כולל פרק 9: המעבר למסלול המשודרג.'},
  {name:'course-stack', file:'course-stack.md', kb:28, info:'מחסנית הקורס. היא שקובעת את ההחלטות הטכניות.'},
  {name:'course-stack-plus', file:'course-stack-plus.md', kb:9.4, info:'המסלול המשודרג: React, TypeScript ו-Vite.'},
  {name:'SUBMISSION', file:'SUBMISSION.md', kb:4, info:'סיכום הגשת שלב א (הפרונט).'},
];
const R = 24, pts = [];
docs.forEach((d,i)=>{
  const a = (i/docs.length)*Math.PI*2 + 0.3;
  const x = Math.cos(a)*R, z = Math.sin(a)*R;
  const h = 3 + Math.log2(d.kb+1)*1.7;
  building({x,z,h,color:COL.doc,name:d.name,file:d.file,info:d.info});
  pts.push([x,z,h]);
  // arc from the source of truth
  const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0,20,0), new THREE.Vector3(x/2,32,z/2), new THREE.Vector3(x,h,z));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(40)),
    new THREE.LineBasicMaterial({color:0xf5c542, transparent:true, opacity:.35})));
});

// ---------- האפליקציה (קיימת) ----------
const appC = new THREE.Vector3(-8, 0, 52);
const appBase = new THREE.Mesh(new THREE.CylinderGeometry(15,15,.6,48), new THREE.MeshStandardMaterial({color:0x143a33}));
appBase.position.set(appC.x,.3,appC.z); scene.add(appBase);
const appLbl = label('האפליקציה · React + Vite',{size:30,color:'#3ddc97',w:560}); appLbl.position.set(appC.x,14,appC.z); scene.add(appLbl);
[
  ['כניסה','מסך כניסה. כרגע מדומה, התחברות אמיתית (Supabase) תבוא בשלב ב.'],
  ['הקמה והעלאה','שיחה עם ה-AI להקמת העסק, והעלאת קובץ CSV/Excel עם אימות מבנה.'],
  ['תמונת מצב','12 KPI בשלושה נושאים, פירוט תובנה, טופס החלטה ורשימת ההחלטות.'],
].forEach(([n,info],i)=>{
  const g = building({x:appC.x+(i-1)*9,z:appC.z,w:6,d:1.4,h:6.5,color:COL.app,emissive:.3,name:n,file:'מסך באפליקציה',info});
});

// ---------- צד שרת (ghost) ----------
const bx = 46, bz = -22;
[
  ['Vercel Function','פונקציה אחת בצד שרת. מדברת עם Gemini ועם Supabase. עוד לא נבנתה.',0,0],
  ['Supabase','ארבע טבלאות נעולות, התחברות והרשאות. עוד לא נבנה.',9,5],
  ['Gemini','ה-AI שמקים את העסק ומנסח תובנות. כרגע שכבת נתונים מדומה.',9,-5],
  ['n8n (מקומי)','בדיקת התוצאה. רץ במחשב, לא ב-Cloud. עוד לא נבנה.',18,0],
].forEach(([n,info,dx,dz])=>building({x:bx+dx,z:bz+dz,w:5,d:5,h:8,color:COL.ghost,ghost:true,name:n,file:'שלב ב · אחרי ההגשה',info}));
const bl = label('צד שרת – שלב ב',{size:30,color:'#9aa3b8'}); bl.position.set(bx+9,17,bz); scene.add(bl);
// dashed link app -> backend
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(appC.x+14,.5,appC.z-4), new THREE.Vector3(bx-3,.5,bz+3)]),
  new THREE.LineDashedMaterial({color:0x9aa3b8, dashSize:1.2, gapSize:1})));
scene.children.at(-1).computeLineDistances();

// ---------- תמונות עיצוב ----------
const ix = -50, iz = -20;
[
  ['wireframes','wireframes.png','שרטוטי המסכים.'],
  ['style-guide','style-guide.png','מדריך סגנון: צבעים וטיפוגרפיה.'],
  ['mockups','mockups.png','הדמיות מלאות של המסכים.'],
].forEach(([n,f,info],i)=>{
  const g = building({x:ix,z:iz+i*10-10,w:.8,d:7,h:7,color:COL.img,emissive:.3,name:n,file:f,info});
  g.rotation.y = 0.35;
});
const il = label('תמונות עיצוב',{size:30,color:'#ff7ab8'}); il.position.set(ix,12,iz); scene.add(il);

// ---------- interaction ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const panel = document.getElementById('panel');
let hovered = null, focusTarget = null;
function pick(e){
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse, camera);
  return ray.intersectObjects(clickable)[0]?.object ?? null;
}
renderer.domElement.addEventListener('pointermove', e=>{
  const o = pick(e);
  if(o!==hovered){ hovered = o; renderer.domElement.style.cursor = o?'pointer':'default'; }
});
let down = null;
renderer.domElement.addEventListener('pointerdown', e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup', e=>{
  if(!down || Math.hypot(e.clientX-down[0], e.clientY-down[1])>5) return;
  const o = pick(e);
  if(o){
    const u = o.userData;
    panel.querySelector('h2').textContent = u.name;
    panel.querySelector('.tag').textContent = u.file;
    panel.querySelector('p').textContent = u.info;
    panel.style.display = 'block';
    focusTarget = u.group.position.clone().setY(u.group.userData.top/2);
    controls.autoRotate = false;
  } else { panel.style.display='none'; focusTarget=null; controls.autoRotate = true; }
});
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t = clock.getElapsedTime();
  ring.rotation.z = t*.6; ring.position.y = 22 + Math.sin(t*1.5)*.4;
  for(const m of clickable){
    if(m.userData.ghost) continue;
    const target = m===hovered ? .8 : m.userData.base;
    m.userData.mat.emissiveIntensity += (target - m.userData.mat.emissiveIntensity)*.15;
  }
  if(focusTarget) controls.target.lerp(focusTarget, .06);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
